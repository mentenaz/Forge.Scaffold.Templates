# Checks that GitHub's build machines can log in to the downloads server over SSH with the templates
# deploy key, and that the folder can be written, before the upload is moved off FTPS.
# Run by hand from the Actions tab. It changes nothing that stays: it makes a folder, writes one file
# in it and removes it again. It also lists the templates folder (read only).
#
# The server only accepts the hmac-sha2-256 MAC, so every ssh call passes it. The host key below is the
# server's public ed25519 key (SHA256:sidusN7ytwdejwMac77aKk9aYwajP0mgqmaAos9E+ZQ); the build machine
# refuses to connect to anything else. Only the private key is secret (SSH_KEY).
name: ssh_check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SSH_HOST: downloads.mentenaz-server.com
      SSH_PORT: "24"
      SSH_USER: mentefpu
      SSH_PATH: /home/mentefpu/downloads.mentenaz-server.com/forge-scaffold
    steps:
      - name: Install the deploy key and the pinned host key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::The SSH_KEY secret is not set."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          # A key saved on Windows can carry CRLF line endings, which ssh rejects.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo '[downloads.mentenaz-server.com]:24 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEaP/0qV5NeAJcIVmPpQKJhRRa8QRoUcS+V2cBvx4I6g' > ~/.ssh/known_hosts

      - name: Log in, look at the templates folder, and check it can be written
        run: |
          ssh -i ~/.ssh/deploy -p "$SSH_PORT" \
            -o MACs=hmac-sha2-256 -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" \
            "set -e; cd $SSH_PATH && pwd && ls -l | head -n 40 && which tar && mkdir .incoming-check && echo ok > .incoming-check/probe && mv -f .incoming-check/probe .incoming-check/probe2 && rm -r .incoming-check && echo 'write, rename and remove all work'"
