# Builds the template archives (official SPFx, yo-derived SPFx, and create-vite templates) and index.json,
# and (only when asked) uploads them to the downloads server over ssh (or FTPS). See docs/publishing.md in the
# Forge.Scaffold.SDK repo for the one-time setup. Run by hand from the Actions tab.
name: Publish templates

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to the downloads server. Leave off to build and check only."
        type: boolean
        default: false
      transport:
        description: "How to upload: ssh (tar over ssh, port 24) or ftps (the fallback)"
        type: choice
        options:
          - ssh
          - ftps
        default: ssh
      include_yo_generators:
        description: "Also release the yo-derived generators (SPFx 1.20.0 to 1.23.2)"
        type: boolean
        default: true
      spfx_ref:
        description: "Branch, tag or commit of the SPFx repo to release the official templates from"
        type: string
        default: main
      vite_templates:
        description: "create-vite templates to release as vite-<name>, separated by spaces (the default is every one that installs and builds: all but qwik and qwik-ts, whose create-vite templates do not npm install). A template left out of this list is left out of the index. Empty releases none."
        type: string
        default: "react-ts vue-ts vanilla-ts svelte-ts solid-ts preact-ts lit-ts react vue vanilla preact lit solid svelte"
      vite_ref:
        description: "Branch, tag or commit of the Vite repo to release the create-vite templates from"
        type: string
        default: main

# Nothing in this workflow needs to write to a repo.
permissions:
  contents: read

# Two publishes must never overlap, and a running one is never cancelled halfway.
concurrency:
  group: publish-templates
  cancel-in-progress: false

env:
  # Repository variables (Settings > Secrets and variables > Actions > Variables).
  BASE_URL: ${{ vars.TEMPLATES_BASE_URL }}          # https://downloads.mentenaz-server.com/forge-scaffold
  SDK_REPOSITORY: ${{ vars.SDK_REPOSITORY || 'mentenaz/Forge.Scaffold.SDK' }}
  SPFX_REPOSITORY: ${{ vars.SPFX_REPOSITORY || 'mentenaz/spfx' }}
  VITE_REPOSITORY: ${{ vars.VITE_REPOSITORY || 'mentenaz/vite' }}

jobs:
  # ------------------------------------------- the index that is live now, read over ssh (the only thing this job does)
  # The build needs the index published last time (it decides which archives keep their revision). The web server (port
  # 443) sometimes does not answer GitHub's runners, while ssh on port 24, which the upload uses, does. So the index is read
  # here over ssh through the server's read-only `index` command and handed to the build as an artifact. This job never
  # fails the workflow: if it cannot read the index (the server script has not been updated yet, or the host does not
  # answer), the build downloads it over https as before. It builds nothing and runs only tools/fetch_index_ssh.sh.
  previous-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the scripts only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: templates
          sparse-checkout: tools
          persist-credentials: false

      - name: Read the live index over ssh
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: downloads.mentenaz-server.com
          SSH_PORT: "24"
          SSH_USER: mentefpu
          SSH_MACS: hmac-sha2-256
          OUT_FILE: previous/index.json
        run: |
          set -euo pipefail
          umask 077
          [ -n "$SSH_KEY" ] || { echo "no SSH_KEY secret: the build will download the index"; exit 1; }
          key="$RUNNER_TEMP/deploy_key"
          known="$RUNNER_TEMP/known_hosts"
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"
          echo '[downloads.mentenaz-server.com]:24 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEaP/0qV5NeAJcIVmPpQKJhRRa8QRoUcS+V2cBvx4I6g' > "$known"
          SSH_KEY_FILE="$key" SSH_KNOWN_HOSTS_FILE="$known" bash templates/tools/fetch_index_ssh.sh

      - name: Hand it to the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previous-index
          path: previous/index.json
          if-no-files-found: ignore
          retention-days: 1

  # ------------------------------------------------------------------ build and check (no secrets)
  build:
    needs: previous-index
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check the settings
        run: |
          case "$BASE_URL" in
            https://*) ;;
            *) echo "::error::Set the repository variable TEMPLATES_BASE_URL to the public https URL, e.g. https://downloads.mentenaz-server.com/forge-scaffold"; exit 1 ;;
          esac

      - name: Check out this repo (templates, overlay, scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: templates
          persist-credentials: false

      # A private repo needs a token that can read it: add the secret CHECKOUT_TOKEN
      # (a fine-grained token with read access to contents of the two repos below).
      - name: Check out the engine (Forge.Scaffold.SDK)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SDK_REPOSITORY }}
          path: sdk
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}
          persist-credentials: false

      - name: Check out the official SPFx templates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SPFX_REPOSITORY }}
          ref: ${{ inputs.spfx_ref }}
          path: spfx
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}
          persist-credentials: false

      # Only the create-vite folder is needed, not the whole Vite monorepo.
      - name: Check out the create-vite templates
        if: ${{ inputs.vite_templates != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.VITE_REPOSITORY }}
          ref: ${{ inputs.vite_ref }}
          path: vite
          sparse-checkout: packages/create-vite
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}
          persist-credentials: false

      # The index the job before this one read over ssh. It is not there when that did not work; the script then
      # downloads the index over https.
      - name: Get the previous index that was read over ssh
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: previous-index
          path: previous

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache the build of the engine
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sdk

      - name: Build the release and check it
        env:
          SPFX_DIR: spfx
          SDK_DIR: sdk
          OUT_DIR: out
          INCLUDE_YO: ${{ inputs.include_yo_generators && '1' || '0' }}
          VITE_DIR: ${{ inputs.vite_templates != '' && 'vite' || '' }}
          VITE_TEMPLATES: ${{ inputs.vite_templates }}
          PREVIOUS_INDEX_FILE: previous/index.json
        run: bash templates/tools/publish_build.sh

      - name: Keep the release for review and for the upload job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: templates-release
          path: out/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------- upload (only when asked; the only job with secrets)
  publish:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Give this environment required reviewers (Settings > Environments > production) so that
    # nothing is uploaded without a person approving it, and keep the secrets below on it.
    environment: production
    steps:
      - name: Check out the scripts only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: templates
          sparse-checkout: tools
          persist-credentials: false

      - name: Get the release that was built and checked
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: templates-release
          path: out

      # ssh: the files travel as one tar stream into a staging folder and are renamed into place, archives
      # first and index.json last (tools/publish_upload_ssh.sh, which calls ~/bin/forge-templates-receive on the
      # server: tools/server/forge-templates-receive.sh, the only thing the key may run). The server only accepts the
      # hmac-sha2-256 MAC, and its host key is pinned below (SHA256:sidusN7ytwdejwMac77aKk9aYwajP0mgqmaAos9E+ZQ);
      # only the private key is secret. See ssh_check.yml for a login check that changes nothing.
      - name: Upload over ssh (archives first, index.json last)
        if: ${{ inputs.transport == 'ssh' }}
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: downloads.mentenaz-server.com
          SSH_PORT: "24"
          SSH_USER: mentefpu
          SSH_MACS: hmac-sha2-256
          OUT_DIR: out
        run: |
          set -euo pipefail
          umask 077
          [ -n "$SSH_KEY" ] || { echo "::error::The SSH_KEY secret is not set."; exit 1; }
          key="$RUNNER_TEMP/deploy_key"
          known="$RUNNER_TEMP/known_hosts"
          trap 'rm -f "$key" "$known"' EXIT
          # A key saved on Windows can carry CRLF line endings, which ssh rejects.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"
          echo '[downloads.mentenaz-server.com]:24 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEaP/0qV5NeAJcIVmPpQKJhRRa8QRoUcS+V2cBvx4I6g' > "$known"
          SSH_KEY_FILE="$key" SSH_KNOWN_HOSTS_FILE="$known" bash templates/tools/publish_upload_ssh.sh

      # ftps (the fallback), the same way build_installers.yml in the Forge Super repo publishes the apt repository to this
      # server: FTPS on port 21 (the host offers no SFTP), the account's own folder is the web root of
      # downloads.mentenaz-server.com. The forgetemplates account is limited to the forge-scaffold
      # folder, so its root (/) is that folder, served at .../forge-scaffold.
      # Two uploads so a client never sees an index that points at a file that is not there yet:
      # the archives first, index.json last. Nothing on the server is deleted. The action keeps a
      # small state file (named per upload) in the folder to send only what changed.
      # The host sometimes does not answer GitHub's runners (a connection timeout), so each upload
      # gets up to three tries; a retry only runs when the try before it failed, and resumes from
      # what the server already has. The index is only uploaded after the archives succeeded.
      - name: Upload the archives
        id: archives1
        if: ${{ inputs.transport == 'ftps' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: out/
          server-dir: /
          state-name: .ftp-deploy-sync-state-archives.json
          exclude: |
            **/index.json
          dangerous-clean-slate: false

      - name: Upload the archives (second try)
        id: archives2
        if: ${{ steps.archives1.outcome == 'failure' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: out/
          server-dir: /
          state-name: .ftp-deploy-sync-state-archives.json
          exclude: |
            **/index.json
          dangerous-clean-slate: false

      - name: Upload the archives (third try)
        id: archives3
        if: ${{ steps.archives1.outcome == 'failure' && steps.archives2.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: out/
          server-dir: /
          state-name: .ftp-deploy-sync-state-archives.json
          exclude: |
            **/index.json
          dangerous-clean-slate: false

      - name: Upload index.json last
        id: index1
        if: ${{ inputs.transport == 'ftps' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: out/
          server-dir: /
          state-name: .ftp-deploy-sync-state-index.json
          exclude: |
            **/*.tar.gz
          dangerous-clean-slate: false

      - name: Upload index.json last (second try)
        id: index2
        if: ${{ steps.index1.outcome == 'failure' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: out/
          server-dir: /
          state-name: .ftp-deploy-sync-state-index.json
          exclude: |
            **/*.tar.gz
          dangerous-clean-slate: false

      - name: Upload index.json last (third try)
        id: index3
        if: ${{ steps.index1.outcome == 'failure' && steps.index2.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: out/
          server-dir: /
          state-name: .ftp-deploy-sync-state-index.json
          exclude: |
            **/*.tar.gz
          dangerous-clean-slate: false

      - name: Check what the server now serves
        run: python3 templates/tools/publish_verify.py
        env:
          OUT_DIR: out
          BASE_URL: ${{ vars.TEMPLATES_BASE_URL }}
